name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: build-apk
  cancel-in-progress: true
env:
  KS_ALIAS: pmk
  APP_ID: com.sched.app
  APP_NAME: "Расписание ПМК"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version (следующий после последнего релиза)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName' || true)
          N=$(printf '%s' "$LAST" | sed -nE 's/^v0\.5\.([0-9]+)$/\1/p')
          echo "VERSION_NAME=0.5.$(( ${N:-0} + 1 ))" >> "$GITHUB_ENV"
          echo "последний релиз: ${LAST:-нет}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Web files
        run: |
          mkdir -p www
          if [ -f index.html ]; then cp index.html www/index.html; else cp "$(ls *.html | head -n1)" www/index.html; fi
          cp -r runners www/runners
          sed -i "s/const APP_VERSION='[^']*'/const APP_VERSION='$VERSION_NAME'/" www/index.html
          grep -c "APP_VERSION='$VERSION_NAME'" www/index.html
      - name: Install Capacitor
        run: |
          npm init -y
          npm i --legacy-peer-deps @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/local-notifications@7 @capacitor/background-runner@2.1.0
      - name: Config
        run: |
          cat > capacitor.config.json <<EOF2
          {
            "appId": "$APP_ID",
            "appName": "$APP_NAME",
            "webDir": "www",
            "plugins": {
              "CapacitorHttp": { "enabled": true },
              "BackgroundRunner": {
                "label": "com.pmk.schedule.check",
                "src": "runners/runner.js",
                "event": "checkSchedule",
                "repeat": true,
                "interval": 15,
                "autoStart": true
              }
            }
          }
          EOF2
      - name: Add Android
        run: |
          npx cap add android
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.USE_EXACT_ALARM"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/><uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/></manifest>#' android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode 1/versionCode $((1000 + GITHUB_RUN_NUMBER))/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          sed -i "s#dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'#dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs', '../../node_modules/@capacitor/background-runner/android/src/main/libs'#" android/app/build.gradle
          grep -n "background-runner" android/app/build.gradle
          npx cap sync android
      - name: In-app updater (native)
        run: |
          D="android/app/src/main/java/$(echo "$APP_ID" | tr . /)"
          mkdir -p "$D"
          cat > "$D/ApkUpdatePlugin.java" <<'EOF3'
          package __PKG__;

          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.provider.Settings;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          @CapacitorPlugin(name = "ApkUpdate")
          public class ApkUpdatePlugin extends Plugin {
              private File apkFile() {
                  File dir = new File(getContext().getCacheDir(), "update");
                  dir.mkdirs();
                  return new File(dir, "update.apk");
              }

              @PluginMethod
              public void download(final PluginCall call) {
                  final String link = call.getString("url");
                  if (link == null) { call.reject("no url"); return; }
                  new Thread(() -> {
                      try {
                          File out = apkFile();
                          File part = new File(out.getParentFile(), "update.part");
                          HttpURLConnection c = (HttpURLConnection) new URL(link).openConnection();
                          c.setInstanceFollowRedirects(true);
                          c.setConnectTimeout(15000);
                          c.setReadTimeout(30000);
                          int code = c.getResponseCode();
                          if (code != 200) { c.disconnect(); call.reject("HTTP " + code); return; }
                          long total = c.getContentLengthLong();
                          InputStream in = c.getInputStream();
                          FileOutputStream os = new FileOutputStream(part);
                          byte[] buf = new byte[32768];
                          long got = 0;
                          int last = -1;
                          int n;
                          while ((n = in.read(buf)) > 0) {
                              os.write(buf, 0, n);
                              got += n;
                              if (total > 0) {
                                  int pct = (int) (got * 100 / total);
                                  if (pct != last) {
                                      last = pct;
                                      JSObject e = new JSObject();
                                      e.put("percent", pct);
                                      notifyListeners("progress", e);
                                  }
                              }
                          }
                          os.close();
                          in.close();
                          if (got < 100000) { call.reject("file too small"); return; }
                          if (out.exists()) out.delete();
                          part.renameTo(out);
                          JSObject r = new JSObject();
                          r.put("size", got);
                          call.resolve(r);
                      } catch (Exception e) {
                          call.reject(String.valueOf(e.getMessage()));
                      }
                  }).start();
              }

              @PluginMethod
              public void install(PluginCall call) {
                  try {
                      Context ctx = getContext();
                      JSObject r = new JSObject();
                      if (!ctx.getPackageManager().canRequestPackageInstalls()) {
                          Intent s = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + ctx.getPackageName()));
                          s.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          ctx.startActivity(s);
                          r.put("needPermission", true);
                          call.resolve(r);
                          return;
                      }
                      Uri u = FileProvider.getUriForFile(ctx, ctx.getPackageName() + ".fileprovider", apkFile());
                      Intent i = new Intent(Intent.ACTION_VIEW);
                      i.setDataAndType(u, "application/vnd.android.package-archive");
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                      ctx.startActivity(i);
                      r.put("started", true);
                      call.resolve(r);
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }
          }
          EOF3
          cat > "$D/MainActivity.java" <<'EOF4'
          package __PKG__;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(ApkUpdatePlugin.class);
                  registerPlugin(WidgetPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF4
          sed -i "s/__PKG__/$APP_ID/" "$D/ApkUpdatePlugin.java" "$D/MainActivity.java"
          cat android/app/src/main/res/xml/file_paths.xml
      - name: Home screen widgets (native)
        run: |
          D="android/app/src/main/java/$(echo "$APP_ID" | tr . /)"
          R=android/app/src/main/res
          mkdir -p "$D" $R/layout $R/xml $R/drawable
          cat > "$D/WidgetData.java" <<'EOF5'
          package __PKG__;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.view.View;
          import android.widget.RemoteViews;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Calendar;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.List;
          import java.util.Locale;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class WidgetData {
              static final String PREFS = "pmk_widget";
              static final String TICK = "com.pmk.schedule.WIDGET_TICK";
              static final Pattern RNG = Pattern.compile("(\\d+):(\\d+)\\s*[-–]\\s*(\\d+):(\\d+)");
              static final int ACCENT = 0xFFFF5A5F, WHITE = 0xFFFFFFFF, MUTED = 0x99FFFFFF, DIM = 0x55FFFFFF;
              static final Locale RU = new Locale("ru");

              static class L { int a, b, n; boolean k; String d, room, t; }

              static void save(Context c, String json) {
                  c.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putString("data", json).apply();
              }

              static JSONObject load(Context c) {
                  try {
                      return new JSONObject(c.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString("data", "{}"));
                  } catch (Exception e) {
                      return new JSONObject();
                  }
              }

              static String dateStr(Calendar cal) {
                  return String.format(Locale.US, "%04d-%02d-%02d", cal.get(Calendar.YEAR), cal.get(Calendar.MONTH) + 1, cal.get(Calendar.DAY_OF_MONTH));
              }

              static String fmt(int m) {
                  return (m / 60) + ":" + (m % 60 < 10 ? "0" : "") + (m % 60);
              }

              static String dur(int m) {
                  if (m < 60) return m + " мин";
                  return (m / 60) + " ч" + (m % 60 > 0 ? " " + (m % 60) + " мин" : "");
              }

              static List<L> day(JSONObject data, String date) {
                  List<L> out = new ArrayList<>();
                  JSONObject days = data.optJSONObject("days");
                  if (days == null) return out;
                  JSONArray arr = days.optJSONArray(date);
                  if (arr == null) return out;
                  for (int i = 0; i < arr.length(); i++) {
                      JSONObject o = arr.optJSONObject(i);
                      if (o == null) continue;
                      Matcher m = RNG.matcher(o.optString("s", ""));
                      if (!m.find()) continue;
                      L l = new L();
                      l.a = Integer.parseInt(m.group(1)) * 60 + Integer.parseInt(m.group(2));
                      l.b = Integer.parseInt(m.group(3)) * 60 + Integer.parseInt(m.group(4));
                      l.d = o.optString("d", "");
                      l.room = o.optString("a", "");
                      l.t = o.optString("t", "");
                      l.k = o.optInt("k", 0) == 1;
                      l.n = o.optInt("n", 0);
                      out.add(l);
                  }
                  Collections.sort(out, new Comparator<L>() {
                      public int compare(L x, L y) { return x.a - y.a; }
                  });
                  return out;
              }

              static Calendar plusDays(Calendar base, int n) {
                  Calendar c = (Calendar) base.clone();
                  c.add(Calendar.DAY_OF_MONTH, n);
                  return c;
              }

              static void bindNext(Context c, RemoteViews rv) {
                  JSONObject data = load(c);
                  Calendar now = Calendar.getInstance();
                  int nm = now.get(Calendar.HOUR_OF_DAY) * 60 + now.get(Calendar.MINUTE);
                  String name = data.optString("name", "");
                  String label, title, meta = "", sub = "";
                  if (name.isEmpty()) {
                      label = "РАСПИСАНИЕ ПМК";
                      title = "Выберите основную группу";
                      meta = "Откройте приложение и нажмите ☆";
                  } else {
                      label = name;
                      title = "Занятий нет";
                      meta = "Ближайшие дни не опубликованы";
                      SimpleDateFormat df = new SimpleDateFormat("EEE, d MMM", RU);
                      outer:
                      for (int off = 0; off <= 7; off++) {
                          Calendar d = plusDays(now, off);
                          List<L> ls = day(data, dateStr(d));
                          for (L l : ls) {
                              String lab = null;
                              if (off == 0) {
                                  if (l.a <= nm && nm < l.b) lab = "СЕЙЧАС · до " + fmt(l.b);
                                  else if (l.a > nm) lab = "ДАЛЕЕ · через " + dur(l.a - nm);
                              } else if (off == 1) lab = "ЗАВТРА";
                              else lab = df.format(d.getTime()).toUpperCase(RU);
                              if (lab == null) continue;
                              label = lab;
                              title = (l.k || l.n <= 0 ? "" : l.n + ". ") + l.d;
                              meta = fmt(l.a) + "–" + fmt(l.b) + (l.room.isEmpty() ? "" : " · " + l.room);
                              sub = l.t;
                              break outer;
                          }
                      }
                  }
                  rv.setTextViewText(R.id.w_label, label);
                  rv.setTextViewText(R.id.w_title, title);
                  rv.setTextViewText(R.id.w_meta, meta);
                  rv.setTextViewText(R.id.w_sub, sub);
                  rv.setViewVisibility(R.id.w_sub, sub.isEmpty() ? View.GONE : View.VISIBLE);
              }

              static void bindToday(Context c, RemoteViews rv) {
                  JSONObject data = load(c);
                  Calendar now = Calendar.getInstance();
                  int nm = now.get(Calendar.HOUR_OF_DAY) * 60 + now.get(Calendar.MINUTE);
                  String name = data.optString("name", "");
                  rv.removeAllViews(R.id.rows);
                  if (name.isEmpty()) {
                      rv.setTextViewText(R.id.w_head, "Расписание ПМК");
                      rv.setTextViewText(R.id.w_empty, "Выберите основную группу ☆ в приложении");
                      rv.setViewVisibility(R.id.w_empty, View.VISIBLE);
                      return;
                  }
                  List<L> use = null;
                  Calendar when = now;
                  int useOff = 0;
                  for (int off = 0; off <= 7; off++) {
                      Calendar d = plusDays(now, off);
                      List<L> ls = day(data, dateStr(d));
                      if (ls.isEmpty()) continue;
                      if (off == 0 && ls.get(ls.size() - 1).b <= nm) continue;
                      use = ls; when = d; useOff = off;
                      break;
                  }
                  SimpleDateFormat df = new SimpleDateFormat("EEEE, d MMMM", RU);
                  String pre = useOff == 0 ? "" : useOff == 1 ? "Завтра · " : "";
                  rv.setTextViewText(R.id.w_head, name + " · " + pre + df.format(when.getTime()));
                  if (use == null) {
                      rv.setTextViewText(R.id.w_empty, "Занятий нет");
                      rv.setViewVisibility(R.id.w_empty, View.VISIBLE);
                      return;
                  }
                  rv.setViewVisibility(R.id.w_empty, View.GONE);
                  int max = 7;
                  for (int i = 0; i < use.size() && i < max; i++) {
                      L l = use.get(i);
                      RemoteViews row = new RemoteViews(c.getPackageName(), R.layout.widget_row);
                      boolean cur = useOff == 0 && l.a <= nm && nm < l.b;
                      boolean past = useOff == 0 && l.b <= nm;
                      if (i == max - 1 && use.size() > max) {
                          row.setTextViewText(R.id.rt, "");
                          row.setTextViewText(R.id.rd, "+" + (use.size() - max + 1) + " ещё");
                          row.setTextViewText(R.id.ra, "");
                          row.setTextColor(R.id.rd, MUTED);
                      } else {
                          row.setTextViewText(R.id.rt, fmt(l.a));
                          row.setTextViewText(R.id.rd, (l.k || l.n <= 0 ? "" : l.n + ". ") + l.d);
                          row.setTextViewText(R.id.ra, l.room);
                          row.setTextColor(R.id.rt, cur ? ACCENT : past ? DIM : MUTED);
                          row.setTextColor(R.id.rd, cur ? ACCENT : past ? DIM : WHITE);
                          row.setTextColor(R.id.ra, cur ? ACCENT : past ? DIM : MUTED);
                      }
                      rv.addView(R.id.rows, row);
                      if (i == max - 1) break;
                  }
              }

              static void bindClick(Context c, RemoteViews rv) {
                  Intent li = c.getPackageManager().getLaunchIntentForPackage(c.getPackageName());
                  if (li != null) {
                      rv.setOnClickPendingIntent(R.id.root, PendingIntent.getActivity(c, 0, li, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT));
                  }
              }

              static void refreshAll(Context c) {
                  AppWidgetManager m = AppWidgetManager.getInstance(c);
                  Class<?>[] ks = new Class<?>[] { NextWidget.class, TodayWidget.class };
                  for (Class<?> k : ks) {
                      int[] ids = m.getAppWidgetIds(new ComponentName(c, k));
                      if (ids.length > 0) {
                          Intent i = new Intent(c, k);
                          i.setAction(AppWidgetManager.ACTION_APPWIDGET_UPDATE);
                          i.putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS, ids);
                          c.sendBroadcast(i);
                      }
                  }
              }

              // следующий пересчёт — на ближайшей границе пары (начало/конец), но не реже раза в час
              static void planTick(Context c) {
                  try {
                      Calendar now = Calendar.getInstance();
                      int nm = now.get(Calendar.HOUR_OF_DAY) * 60 + now.get(Calendar.MINUTE);
                      int best = 24 * 60 + 1;
                      for (L l : day(load(c), dateStr(now))) {
                          if (l.a > nm && l.a < best) best = l.a;
                          if (l.b > nm && l.b < best) best = l.b;
                      }
                      Calendar t = (Calendar) now.clone();
                      t.set(Calendar.HOUR_OF_DAY, 0);
                      t.set(Calendar.MINUTE, 0);
                      t.set(Calendar.SECOND, 0);
                      t.set(Calendar.MILLISECOND, 0);
                      t.add(Calendar.MINUTE, best);
                      long at = Math.min(t.getTimeInMillis(), System.currentTimeMillis() + 3600000L);
                      AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                      Intent i = new Intent(c, TodayWidget.class);
                      i.setAction(TICK);
                      PendingIntent pi = PendingIntent.getBroadcast(c, 77, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                      am.setAndAllowWhileIdle(AlarmManager.RTC, at, pi);
                  } catch (Exception e) { }
              }
          }
          EOF5
          cat > "$D/NextWidget.java" <<'EOF6'
          package __PKG__;

          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.Context;
          import android.content.Intent;
          import android.widget.RemoteViews;

          public class NextWidget extends AppWidgetProvider {
              @Override
              public void onUpdate(Context c, AppWidgetManager m, int[] ids) {
                  for (int id : ids) {
                      RemoteViews rv = new RemoteViews(c.getPackageName(), R.layout.widget_next);
                      WidgetData.bindNext(c, rv);
                      WidgetData.bindClick(c, rv);
                      m.updateAppWidget(id, rv);
                  }
                  WidgetData.planTick(c);
              }

              @Override
              public void onReceive(Context c, Intent i) {
                  if (WidgetData.TICK.equals(i.getAction())) { WidgetData.refreshAll(c); return; }
                  super.onReceive(c, i);
              }
          }
          EOF6
          cat > "$D/TodayWidget.java" <<'EOF7'
          package __PKG__;

          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.Context;
          import android.content.Intent;
          import android.widget.RemoteViews;

          public class TodayWidget extends AppWidgetProvider {
              @Override
              public void onUpdate(Context c, AppWidgetManager m, int[] ids) {
                  for (int id : ids) {
                      RemoteViews rv = new RemoteViews(c.getPackageName(), R.layout.widget_today);
                      WidgetData.bindToday(c, rv);
                      WidgetData.bindClick(c, rv);
                      m.updateAppWidget(id, rv);
                  }
                  WidgetData.planTick(c);
              }

              @Override
              public void onReceive(Context c, Intent i) {
                  if (WidgetData.TICK.equals(i.getAction())) { WidgetData.refreshAll(c); return; }
                  super.onReceive(c, i);
              }
          }
          EOF7
          cat > "$D/WidgetPlugin.java" <<'EOF8'
          package __PKG__;

          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "PmkWidget")
          public class WidgetPlugin extends Plugin {
              @PluginMethod
              public void save(PluginCall call) {
                  String json = call.getString("json");
                  if (json == null) { call.reject("no json"); return; }
                  WidgetData.save(getContext(), json);
                  WidgetData.refreshAll(getContext());
                  call.resolve();
              }
          }
          EOF8
          sed -i "s/__PKG__/$APP_ID/" "$D/WidgetData.java" "$D/NextWidget.java" "$D/TodayWidget.java" "$D/WidgetPlugin.java"
          cat > $R/drawable/widget_bg.xml <<'EOF9'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#F012050A"/>
              <corners android:radius="22dp"/>
          </shape>
          EOF9
          cat > $R/layout/widget_next.xml <<'EOF10'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center_vertical"
              android:padding="14dp"
              android:background="@drawable/widget_bg">
              <TextView android:id="@+id/w_label" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:textColor="#FFFF5A5F" android:textSize="11sp" android:textStyle="bold" android:maxLines="1" android:ellipsize="end"/>
              <TextView android:id="@+id/w_title" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:layout_marginTop="2dp" android:textColor="#FFFFFFFF" android:textSize="16sp" android:textStyle="bold" android:maxLines="2" android:ellipsize="end"/>
              <TextView android:id="@+id/w_meta" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:layout_marginTop="2dp" android:textColor="#99FFFFFF" android:textSize="13sp" android:maxLines="1" android:ellipsize="end"/>
              <TextView android:id="@+id/w_sub" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:textColor="#66FFFFFF" android:textSize="12sp" android:maxLines="1" android:ellipsize="end"/>
          </LinearLayout>
          EOF10
          cat > $R/layout/widget_today.xml <<'EOF11'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="14dp"
              android:background="@drawable/widget_bg">
              <TextView android:id="@+id/w_head" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:layout_marginBottom="6dp" android:textColor="#FFFF5A5F" android:textSize="12sp" android:textStyle="bold" android:maxLines="1" android:ellipsize="end"/>
              <LinearLayout android:id="@+id/rows" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical"/>
              <TextView android:id="@+id/w_empty" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:visibility="gone" android:paddingTop="8dp" android:textColor="#99FFFFFF" android:textSize="14sp"/>
          </LinearLayout>
          EOF11
          cat > $R/layout/widget_row.xml <<'EOF12'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="horizontal"
              android:paddingTop="3dp"
              android:paddingBottom="3dp">
              <TextView android:id="@+id/rt" android:layout_width="44dp" android:layout_height="wrap_content"
                  android:textColor="#99FFFFFF" android:textSize="12sp" android:maxLines="1"/>
              <TextView android:id="@+id/rd" android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content"
                  android:textColor="#FFFFFFFF" android:textSize="13sp" android:textStyle="bold" android:maxLines="1" android:ellipsize="end"/>
              <TextView android:id="@+id/ra" android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:layout_marginStart="6dp" android:textColor="#99FFFFFF" android:textSize="12sp" android:maxLines="1"/>
          </LinearLayout>
          EOF12
          cat > $R/xml/widget_next_info.xml <<'EOF13'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="110dp"
              android:minHeight="40dp"
              android:targetCellWidth="2"
              android:targetCellHeight="1"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_next"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"/>
          EOF13
          cat > $R/xml/widget_today_info.xml <<'EOF14'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="180dp"
              android:targetCellWidth="4"
              android:targetCellHeight="3"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_today"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"/>
          EOF14
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          r=''.join('<receiver android:name=".%s" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/%s"/></receiver>'%(c,x) for c,x in [('NextWidget','widget_next_info'),('TodayWidget','widget_today_info')])
          assert '</application>' in s
          s=s.replace('</application>',r+'</application>',1)
          open(p,'w',encoding='utf-8').write(s)
          PY
          grep -c "Widget" android/app/src/main/AndroidManifest.xml
      - name: Signing key
        env:
          KS_B64: ${{ secrets.KS_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "Секрет KS_B64 не задан — подпись временная"; exit 0; fi
          echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          cat > sign.gradle.txt <<'EOF2'
              signingConfigs {
                  debug {
                      storeFile file(System.getenv('GITHUB_WORKSPACE') + '/release.keystore')
                      storePassword System.getenv('KS_PASS')
                      keyAlias System.getenv('KS_ALIAS')
                      keyPassword System.getenv('KS_PASS')
                  }
              }
          EOF2
          sed -i '/^android {/r sign.gradle.txt' android/app/build.gradle
      - name: Icon (только если в репозитории есть PNG)
        run: |
          if ls *.png >/dev/null 2>&1; then
            mkdir -p assets
            cp "$(ls *.png | head -n1)" assets/icon.png
            npm i --legacy-peer-deps @capacitor/assets
            npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff'
          fi
      - name: Build APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pmk-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release (обновление для пользователей)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          APK="pmk-$VERSION_NAME.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          TEXT=$(printf '%s' "$COMMIT_MSG" | head -n1)
          case "$TEXT" in "Add files via upload"*|"Update "*|"Create "*|"Rename "*|"Delete "*) TEXT="";; esac
          jq -n --arg v "$VERSION_NAME" --arg t "$TEXT" --arg u "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION_NAME/$APK" '{version:$v,text:$t,url:$u}' > version.json
          cat version.json
          gh release create "v$VERSION_NAME" "$APK" version.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Версия $VERSION_NAME" --notes "${TEXT:-Обновление}"
