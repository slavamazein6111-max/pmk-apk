name: Clean releases
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Напишите DELETE, чтобы стереть ВСЕ релизы и теги'
        required: true
jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete all releases and tags
        if: ${{ inputs.confirm == 'DELETE' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for T in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 500 --json tagName -q '.[].tagName'); do
            gh release delete "$T" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
          echo "Осталось релизов:"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 5
