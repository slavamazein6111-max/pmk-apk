/* ===== Заставка (по видно) ===== */
.splash{position:fixed;inset:0;z-index:100;pointer-events:none}
.sp-t{position:absolute;left:50%;top:47%;white-space:nowrap;font-family:var(--fw);font-stretch:125%;font-weight:800;font-size:44px;line-height:1;letter-spacing:-.04em;color:#fff;transform:translate(-50%,-50%);transform-origin:0 0;will-change:transform,opacity;visibility:hidden}
.sp-t.rdy{visibility:visible}
.sp-t.go{transition:transform 1s cubic-bezier(.4,.1,.1,1)}
.sp-t.fade{opacity:0;transition:transform 1s cubic-bezier(.4,.1,.1,1),opacity .25s linear}
.sp-c{display:inline-block;opacity:0;animation:spC .5s cubic-bezier(.22,.8,.25,1) var(--d,0s) both}
.sp-c.k{color:var(--acc2,#ff9a9d)}
@keyframes spC{0%{opacity:0;filter:blur(.14em);transform:translate3d(0,.14em,0)}50%{opacity:1}100%{opacity:1;filter:blur(0);transform:none}}
.sp-b{position:absolute;left:0;right:0;top:56%;text-align:center;font-family:var(--fw);font-stretch:125%;font-weight:700;font-size:13px;letter-spacing:.5em;text-indent:.5em;text-transform:lowercase;color:rgba(255,255,255,.62);opacity:0;animation:spB .9s cubic-bezier(.22,.8,.25,1) 1s forwards}
.sp-b.out{animation:spBo .45s ease-in forwards}
@keyframes spB{from{opacity:0;transform:translate3d(0,8px,0);letter-spacing:.7em}to{opacity:1;transform:none;letter-spacing:.5em}}
@keyframes spBo{from{opacity:1}to{opacity:0}}
/* ===== Заставка Майнкрафта: «Generating world» (как в игре) ===== */
.splash.mcs{background-color:#231c17;image-rendering:pixelated;transition:opacity .45s linear}
.splash.mcs.out{opacity:0}
.mcs canvas{position:absolute;left:50%;transform:translateX(-50%);image-rendering:pixelated;opacity:0}
.mcs.rdy canvas,.mcs.rdy .mc-bar{opacity:1}
.mcs .mc-bar{position:absolute;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);opacity:0}
.mcs .mc-bar i{display:block;height:100%;width:0;background:#80ff80;box-shadow:inset 0 calc(var(--s)*.5) 0 #c4ffc4,inset 0 calc(var(--s)*-.5) 0 #4fd44f}
.halves{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:10px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.halves .h{padding:2px 7px;border-radius:8px;background:rgba(var(--fg),.12);color:var(--text);font-weight:600}
.halves .hb{font-size:11.5px}
.halves .h.on{background:var(--text);color:var(--bg)}
.halves .hb.on{color:var(--warn);font-weight:650}
.row.now .halves{color:inherit}
.row.now .halves .h{background:rgba(0,0,0,.22);color:inherit}
.row.now .halves .h.on{background:var(--on);color:var(--accent)}
.row.now .halves .hb.on{color:inherit}
.bl{margin-top:12px;font-size:12.5px;font-weight:650;color:inherit;opacity:.9}
.bl+.bar{margin-top:6px}
.bar i{transition:width .3s linear}
.updb{flex-wrap:wrap}.updb .ut{flex:1 1 0;min-width:0}.updb .bar{flex:0 0 100%;margin-top:2px}.updb .uerr{flex:0 0 100%;font-size:12.5px;line-height:1.35;color:var(--warn)}.updb .uerr button{text-decoration:underline;margin-left:6px;font-size:12.5px}.ua button:disabled{opacity:.75;cursor:default}
.bar.brk i{background:var(--warn)}
.row.now .bar.brk i{background:var(--on)}
body.pre header{opacity:0}
body.pre .acts,body.pre .seg,body.pre .days,body.pre main{opacity:0;transform:translate3d(0,-6px,0)}
body.hb .brand{opacity:0}
body.rev header{transition:opacity .45s ease-out}
body.rev .acts{transition:opacity .55s ease-out,transform .8s cubic-bezier(.22,.8,.25,1)}
body.rev .seg{transition:opacity .55s ease-out .12s,transform .8s cubic-bezier(.22,.8,.25,1) .12s}
body.rev .days{transition:opacity .55s ease-out .24s,transform .8s cubic-bezier(.22,.8,.25,1) .24s}
body.rev main{transition:opacity .6s ease-out .38s,transform .8s cubic-bezier(.22,.8,.25,1) .38s}
.brand{transition:opacity .25s linear}
.brand i{color:var(--acc2)}
@media (prefers-reduced-motion:reduce){.sp-c{animation-duration:.01s}}

html.mc .aur{display:none!important}
html.mc header{background:#262626!important;border-bottom:2px solid #000!important;box-shadow:0 2px 0 rgba(255,255,255,.25)!important;text-shadow:none}
html.mc .brand{color:#c9c9c9!important;font-weight:900;text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000,3px 3px 0 #000,0 4px 0 #555}
html.mc .brand i{color:#8fe05a!important;text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000,3px 3px 0 #000}
html.mc .t::after{background:rgba(255,255,255,.55)!important}
html.mc .t::before{background:#fff!important;border:2px solid #000!important}
html.mc .row.now .t::before{background:#5cb335!important;box-shadow:none!important}
html.mc .d{background:rgba(0,0,0,.3)!important;box-shadow:inset 2px 2px 0 rgba(255,255,255,.25),inset -2px -2px 0 rgba(0,0,0,.35),0 0 0 2px #000}
html.mc .d.on{background:#5cb335!important;color:#fff!important;box-shadow:inset 3px 3px 0 #9be36a,inset -3px -3px 0 #2f7a14,0 0 0 2px #000!important}
html.mc .d.tod b{color:#ffd84a}
html.mc .d.tod:not(.on){box-shadow:inset 0 0 0 2px #ffd84a,0 0 0 2px #000!important}
html.mc .card{--text:#3b3b3b;--muted:#5d5d5d;--fg:0,0,0;color:#3b3b3b;text-shadow:none;background:#c6c6c6!important;border:0!important;box-shadow:inset 3px 3px 0 #fff,inset -3px -3px 0 #555,0 0 0 2px #000!important;backdrop-filter:none!important}
html.mc .row.kl .card,html.mc .row.brk .card{--text:#fff;--muted:#e3f3ff;--fg:255,255,255;color:#fff;text-shadow:2px 2px 0 rgba(10,50,110,.55);background:rgba(255,255,255,.25)!important;border:2px dashed #fff!important;box-shadow:none!important}
html.mc .row.now .card{--text:#fff;--muted:#eaffd9;--fg:255,255,255;color:#fff!important;text-shadow:2px 2px 0 rgba(0,0,0,.35);background:#5cb335!important;box-shadow:inset 3px 3px 0 #9be36a,inset -3px -3px 0 #2f7a14,0 0 0 2px #000!important}
html.mc .row.now .card::after,html.mc .row.now .c::before{display:none!important}
html.mc .row.past{opacity:1!important}
html.mc .row.past:not(.kl):not(.brk) .card{background:#9a9a9a!important;--text:#4a4a4a;--muted:#666;color:#4a4a4a}
html.mc .row.past.kl .card,html.mc .row.past.brk .card{opacity:.7}
html.mc .t b,html.mc .t span{text-shadow:2px 2px 0 rgba(10,50,110,.8)}
html.mc .row.brk.now .card{background:#4f9f2c!important;border:2px solid #fff!important}
html.mc .bar{background:#555!important;height:6px!important}
html.mc .updb,html.mc .offb{background:rgba(0,0,0,.6)!important;border:2px solid #000;color:#fff!important;text-shadow:none}
html.mc .sheet{--text:#3b3b3b;--muted:#5d5d5d;--line:#8b8b8b;--fg:0,0,0;--acc2:#2f7a14;color:#3b3b3b;text-shadow:none;background:#c6c6c6!important;border:0!important;box-shadow:inset 3px 3px 0 #fff,inset -3px -3px 0 #555,0 0 0 2px #000!important}
html.mc .shead h3{color:#3b3b3b;text-shadow:none}
html.mc .btn,html.mc .stabs button,html.mc .sbtn,html.mc .bell,html.mc .seg button,html.mc .today{background:#6f6f6f!important;color:#fff!important;text-shadow:2px 2px 0 #3f3f3f;box-shadow:inset 3px 3px 0 #a5a5a5,inset -3px -3px 0 #3b3b3b,0 0 0 2px #000!important}
html.mc .stabs button.on,html.mc .bell.on,html.mc .seg button.on{background:#5cb335!important;box-shadow:inset 3px 3px 0 #9be36a,inset -3px -3px 0 #2f7a14,0 0 0 2px #000!important}
html.mc .seg{background:#000!important;padding:4px}
html.mc .seg-i{display:none}
html.mc .stabs .beta{background:#000!important;color:#ffd84a!important;text-shadow:none}
html.mc .stile{box-shadow:inset 3px 3px 0 rgba(255,255,255,.3),inset -3px -3px 0 rgba(0,0,0,.4),0 0 0 2px #000!important}
html.mc .stile b,html.mc .stile small{text-shadow:2px 2px 0 rgba(10,50,110,.6)}
html.mc .tm,html.mc .dtx,html.mc .sheet #q{background:#000!important;color:#fff!important;border:2px solid #a0a0a0!important}
html.mc .sw i{background:#373737!important;box-shadow:inset 2px 2px 0 #000}
html.mc .sw i::after{background:#c6c6c6!important;box-shadow:inset -2px -2px 0 #555}
html.mc .sw input:checked+i{background:#5cb335!important}
html.mc .toast{background:#2b2b2b!important;color:#fff!important;text-shadow:none;box-shadow:inset 2px 2px 0 #5a5a5a,0 0 0 2px #000!important}

html.mc .btn,html.mc .stabs button,html.mc .sbtn,html.mc .bell,html.mc .seg button,html.mc .today,html.mc .pick,html.mc .star,html.mc .stl-b{background:#6f6f6f!important;color:#e0e0e0!important;text-shadow:2px 2px 0 #3f3f3f;border:2px solid #000!important;box-shadow:inset 2px 2px 0 #a0a0a0,inset -2px -2px 0 #3b3b3b!important;transition:none!important;cursor:pointer}

const mins=t=>{const m=/(\d{1,2})\s*[:.]\s*(\d{2})/.exec(t||'');return m?+m[1]*60+ +m[2]:9999};
const rng=t=>{const m=/(\d{1,2})\s*[:.]\s*(\d{2})\s*(?:[-–—−‒―]|до|по|to)\s*(\d{1,2})\s*[:.]\s*(\d{2})/i.exec(t||'');return m?[+m[1]*60+ +m[2],+m[3]*60+ +m[4]]:null};
/* ===== Единая система времени пар =====
   Источник истины — сетка звонков BELLS: день недели (или '*') → номер пары → {s:[начало,конец], h:[[a1,b1],[a2,b2]]}, минуты от полуночи.
   Пара = две половины с перерывом внутри; границы половинок берутся из РЕАЛЬНОЙ сетки, а не вычисляются.
   Приоритет для пары: 1) сетка из сообщения API ЭТОГО дня  2) диапазон из поля start  3) сетка этого дня недели, выученная ранее  4) DEFAULT_BELLS.
   Любая пара приводится к каноническому виду l.s='Ч:ММ-Ч:ММ' (+ l.h — половинки), поэтому все остальные части приложения читают одно и то же время. */
const HALF_BRK=5;   // перерыв внутри пары, если точные половинки неизвестны
/* Запасная сетка (если API не прислал ни время, ни сообщение со звонками). Формат: номер → [[начало1,конец1],[начало2,конец2]] в минутах.
   Заполните по реальному расписанию звонков; пример: 1: [[8*60+30,9*60+10],[9*60+15,9*60+55]] */
const DEFAULT_BELLS={};
const BELLS_KEY='pmk-bells2';
let BELLS=(()=>{try{const o=JSON.parse(localStorage.getItem(BELLS_KEY)||'{}');return o&&typeof o==='object'?o:{}}catch(e){return {}}})();
let BELLS_VER=1;
try{localStorage.removeItem('pmk-slot')}catch(e){}   // старый кэш времени мог содержать неверные значения — сбрасываем
const fmtRange=(a,b)=>`${Math.floor(a/60)}:${pad(a%60)}-${Math.floor(b/60)}:${pad(b%60)}`;
const mkBell=h=>({s:[h[0][0],h[h.length-1][1]],h:h.length===2?h:null});
function parseBells(txt){   // «1 пара 8.30 – 9.10, 9.15 – 9.55; 9.55 – 10.50 большой перерыв; 2 пара …» → {номер:{s,h}} | null
if(!txt||!/пар/i.test(txt))return null;
const T=/(\d{1,2})\s*[:.]\s*(\d{2})\s*(?:[-–—−‒―]|до)\s*(\d{1,2})\s*[:.]\s*(\d{2})/g,acc={};let cur=0;
for(const seg of String(txt).split(/[;\n]+/)){
const pm=/(\d)\s*(?:-?\s*я)?\s*пара/i.exec(seg);if(pm)cur=+pm[1];
if(/больш|перерыв/i.test(seg)||!cur)continue;
let m;T.lastIndex=0;while((m=T.exec(seg))){const a=+m[1]*60+ +m[2],b=+m[3]*60+ +m[4];if(b>a&&b-a<=130)(acc[cur]||(acc[cur]=[])).push([a,b])}}
const out={};let prev=-1,ok=0;
for(const n of Object.keys(acc).map(Number).sort((a,b)=>a-b)){
const h=acc[n].sort((x,y)=>x[0]-y[0]);
let good=h[0][0]>=prev;for(let i=1;i<h.length;i++)if(h[i][0]<h[i-1][1])good=false;
const b=mkBell(h.length>2?[h[0],h[h.length-1]]:h),len=b.s[1]-b.s[0];
if(!good||len<30||len>200)continue;
out[n]=b;prev=b.s[1];ok=1}
return ok?out:null}
function learnBells(txt,wd){   // выучить звонки из текста и запомнить для дня недели; вернуть выученное
const p=parseBells(txt);if(!p)return null;
const cur=JSON.stringify(BELLS);
BELLS[wd]={...(BELLS[wd]||{}),...p};BELLS['*']={...(BELLS['*']||{}),...p};
if(JSON.stringify(BELLS)!==cur){BELLS_VER++;try{localStorage.setItem(BELLS_KEY,JSON.stringify(BELLS))}catch(e){}}
return p}
const dayBells=(msgs,wd)=>{const own={};for(const t of msgs){const p=learnBells(t,wd);if(p)Object.assign(own,p)}return own};
const storedBell=(n,wd)=>(BELLS[wd]&&BELLS[wd][n])||(BELLS['*']&&BELLS['*'][n])||(DEFAULT_BELLS[n]?mkBell(DEFAULT_BELLS[n]):null);
/* Привести времена пар одного дня к единому виду. own — сетка из сообщений ЭТОГО дня. Повторный вызов даёт тот же результат. */
function resolveTimes(lessons,wd,own){
const byGroup={};for(const l of lessons)if(!l.k)(byGroup[l.g]||(byGroup[l.g]=[])).push(l);
for(const arr of Object.values(byGroup)){
const hasN=arr.some(l=>l.n);
arr.forEach((l,i)=>{
const n=l.n||(hasN?'':i+1);if(!n)return;
const r=rng(l.s),t0=mins(l.s),ob=own&&own[n],sb=storedBell(n,wd);
const fits=b=>!!b&&(r?b.s[0]===r[0]&&b.s[1]===r[1]:t0>=9999||b.s[0]===t0);   // сетка подходит, только если совпадает с временем из API
if(r){l.h=(ob&&fits(ob)&&ob.h)||(sb&&fits(sb)&&sb.h)||null;return}   // полный диапазон пришёл из API — он главный, сетка нужна лишь для половинок
if(ob&&fits(ob)){l.s=fmtRange(ob.s[0],ob.s[1]);l.h=ob.h||null;return}
if(sb&&fits(sb)){l.s=fmtRange(sb.s[0],sb.s[1]);l.h=sb.h||null;return}
const b=ob||sb;   // сетка не совпала: берём из API начало, а длительность — из сетки
if(b){const len=b.s[1]-b.s[0];l.s=t0<9999?fmtRange(t0,t0+len):fmtRange(b.s[0],b.s[1]);l.h=null}})}
/* Классный час: если у него нет полного диапазона — берём время по номеру звонка, иначе ставим сразу после последней пары группы */
const KL_DUR=30,KL_GAP=10;
const ends={};for(const l of lessons)if(!l.k){const r=rng(l.s);if(r)ends[l.g]=Math.max(ends[l.g]||0,r[1])}
for(const l of lessons){
if(!l.k||rng(l.s))continue;
const st=mins(l.s),kb=l.kn&&((own&&own[l.kn])||storedBell(l.kn,wd));
if(st<9999){l.s=fmtRange(st,st+KL_DUR);continue}
if(kb){l.s=fmtRange(kb.s[0],kb.s[1]);continue}
if(ends[l.g]){const a=ends[l.g]+KL_GAP;l.s=fmtRange(a,a+KL_DUR)}}
}

const COIN='🪙',DAILY_COINS=1;

try{const o=JSON.parse(localStorage.getItem('pmk-coins')||'null');if(o&&typeof o==='object'){coins.bal=Math.max(0,Math.floor(+o.bal)||0);coins.last=typeof o.last==='string'?o.last:'';coins.days=Math.max(0,Math.floor(+o.days)||0)}}catch(e){}

function coinsDaily(){   // true, если сегодня монета ещё не начислялась (откат даты назад монет не даёт)

coins.last=t;coins.bal+=DAILY_COINS;coins.days++;coinsSave();return true;
}

}

function sha256(str){
const b=new TextEncoder().encode(str),l=b.length,n=((l+9+63)>>6)<<4,w=new Uint32Array(n);
for(let i=0;i<l;i++)w[i>>2]|=b[i]<<(24-(i&3)*8);
w[l>>2]|=0x80<<(24-(l&3)*8);w[n-1]=l*8;
const K=new Uint32Array(64),h=new Uint32Array(8),W=new Uint32Array(64);
for(let i=0,c=2;i<64;c++){let p=1;for(let d=2;d*d<=c;d++)if(c%d===0){p=0;break}if(p){if(i<8)h[i]=(Math.sqrt(c)%1)*4294967296;K[i++]=(Math.cbrt(c)%1)*4294967296}}
for(let o=0;o<n;o+=16){
for(let i=0;i<16;i++)W[i]=w[o+i];
for(let i=16;i<64;i++){const x=W[i-15],y=W[i-2];W[i]=W[i-16]+(((x>>>7)|(x<<25))^((x>>>18)|(x<<14))^(x>>>3))+W[i-7]+(((y>>>17)|(y<<15))^((y>>>19)|(y<<13))^(y>>>10))}
let a=h[0],b2=h[1],c=h[2],d=h[3],e=h[4],f=h[5],g=h[6],q=h[7];
for(let i=0;i<64;i++){const t1=q+(((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)))+((e&f)^(~e&g))+K[i]+W[i],t2=(((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)))+((a&b2)^(a&c)^(b2&c));q=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b2;b2=a;a=(t1+t2)>>>0}
h[0]+=a;h[1]+=b2;h[2]+=c;h[3]+=d;h[4]+=e;h[5]+=f;h[6]+=g;h[7]+=q}
return Array.from(h,x=>x.toString(16).padStart(8,'0')).join('')}

async function promoFetch(){

if(r.status===404){const e=new Error('promo.json не найден');e.nf=1;throw e}

function promoFind(db,code){

}

if(!p||typeof p!=='object')return {ok:false,title:'Промокод не найден',body:'Проверьте код и попробуйте ещё раз'};

if(t-t0>=500){

}

<script>
(function(){
/* День и ночь (только в теме «Майнкрафт»): цикл 4 мин — день ~2 мин, закат, ночь, рассвет */
var P=240,t0=Date.now(),H=document.documentElement,B=document.body;
function mk(c){var d=document.createElement('div');d.className='mcsky '+c;B.appendChild(d);return d}
var ov=mk(''),st=mk('mcstars'),sn=mk('mcsun');
var S=[[0,255,255,255,0],[100,255,200,120,0],[115,255,120,60,.26],[130,10,16,50,.72],[210,10,16,50,.72],[225,70,70,120,.3],[240,255,255,255,0]];
function cur(){var s=((Date.now()-t0)/1000+(window.__mcSkip||0))%P;
for(var i=1;i<S.length;i++)if(s<=S[i][0]){var a=S[i-1],b=S[i],k=(s-a[0])/(b[0]-a[0]);return{s:s,c:[1,2,3,4].map(function(j){return a[j]+(b[j]-a[j])*k})}}return{s:0,c:S[0].slice(1)}}
window.__mcCur=cur;function tick(){if(!H.classList.contains('mc')||document.hidden)return;
var r=cur(),c=r.c;ov.style.background='rgba('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+','+c[3].toFixed(3)+')';H.style.setProperty('--mcov',ov.style.background);
st.style.opacity=Math.max(0,Math.min(1,(c[3]-.3)/.4)).toFixed(2);H.style.setProperty('--mcst',st.style.opacity);
var day=r.s<125,u=day?r.s/125:(r.s-115)/125;u=Math.max(0,Math.min(1,u));
sn.style.opacity=(u<.04||u>.96)?0:.95;
sn.style.left=(u*100-6)+'%';sn.style.top=(58-Math.sin(u*Math.PI)*32)+'%';
sn.style.background=day?'#fff3a0':'#dfe6ee';
sn.style.boxShadow=day?'inset -6px -6px 0 #f5c542,0 0 0 4px rgba(255,240,150,.35)':'inset -8px -8px 0 #aab4c2';
}
setInterval(tick,500);tick();
})();
</script>
<script>
/* Звуки темы «Майнкрафт» (из пака MinecraftSoundEffects); уважают кнопку звука приложения */
(function(){
var U={"click": "media/click.wav", "wood": "media/wood.wav", "pop": "media/pop.wav", "dopen": "media/dopen.wav", "dclose": "media/dclose.wav", "orb": "media/orb.wav", "cave": "media/cave.mp3"},pl={},G={click:0,wood:-1,pop:-4,dopen:-1,dclose:-1,orb:0,cave:-2};
var H=document.documentElement;window.__mcU=U;
var last=0;window.__mcSnd=function(n){try{if(!H.classList.contains('mc'))return;var now=Date.now();if(now-last<80&&n!=='cave')return;last=now;window.__mcOK=1;try{(pl[n]||(pl[n]=mkSnd(U[n],G[n])))()}finally{window.__mcOK=0}}catch(e){}};
Object.keys(U).forEach(function(k){try{pl[k]=mkSnd(U[k],G[k])}catch(e){}});
document.addEventListener('click',function(e){
if(!H.classList.contains('mc'))return;var t=e.target;if(!t.closest)return;
if(t.closest('#snd,.d'))return;
if(t.closest('.star'))return window.__mcSnd('orb');
if(t.closest('.btn,.stabs button,.sbtn,.bell,.seg button,.today,.pick,.stl-b,.stile,#list button,#set [data-lead],#set [data-pw],#set [data-wo]'))window.__mcSnd('click')},true);
document.addEventListener('change',function(e){var x=e.target;if(x&&x.type==='checkbox'&&x.closest&&x.closest('#set'))window.__mcSnd('pop')},true);
['ov','set','dev'].forEach(function(id){var el=document.getElementById(id);if(!el)return;
new MutationObserver(function(m){var was=/\bshow\b/.test(m[0].oldValue||''),now=el.classList.contains('show');
if(now&&!was)window.__mcSnd('dopen');else if(!now&&was)window.__mcSnd('dclose')}).observe(el,{attributes:true,attributeFilter:['class'],attributeOldValue:true})});
})();

<script>
/* Ночь в теме «Майнкрафт»: звук пещеры в начале ночи, через 6 с — случайная песня, к утру плавно затихает */
(function(){
var S={"key": "media/key.mp3", "lullaby": "media/lullaby.mp3", "moog": "media/moog.mp3", "haggstrom": "media/haggstrom.mp3", "minecraft": "media/minecraft.mp3", "oxygene": "media/oxygene.mp3"},K=Object.keys(S),H=document.documentElement,mb=null,cb=null,ld=false,ph=0,src=null,go=null;
function ac(){try{return sndCtx}catch(e){return null}}
function dec(u){return fetch(u).then(function(r){return r.arrayBuffer()}).then(function(b){return new Promise(function(ok,no){ac().decodeAudioData(b,ok,no)})})}
function nxt(){var bag=[],last='';try{bag=JSON.parse(localStorage.getItem('pmk-mc-bag')||'[]');last=localStorage.getItem('pmk-mc-last')||''}catch(e){}
bag=bag.filter(function(k){return S[k]});
if(!bag.length){bag=K.slice();for(var i=bag.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=bag[i];bag[i]=bag[j];bag[j]=x}
if(bag[0]===last&&bag.length>1)bag.push(bag.shift())}
var k=bag.shift();try{localStorage.setItem('pmk-mc-bag',JSON.stringify(bag));localStorage.setItem('pmk-mc-last',k)}catch(e){}window.__mcSong=k;return k}
function prep(){if(ld||mb)return;ld=true;dec(S[nxt()]).then(function(m){return dec(window.__mcU.cave).then(function(c){mb=m;cb=c})}).catch(function(){ld=false})}
function stop(){if(src){try{src.stop()}catch(e){}src=null}mb=null;cb=null;ld=false;ph=0;go=null}
function begin(s){var c=ac(),t=c.currentTime+.05;
if(s<132){var n=c.createBufferSource();n.buffer=cb;var g=c.createGain();g.gain.value=Math.pow(10,-2/20);n.connect(g);g.connect(c.destination);n.start(t);t+=6}
var gi=c.createGain();go=c.createGain();gi.gain.setValueAtTime(0,t);gi.gain.linearRampToValueAtTime(.55,t+4);
src=c.createBufferSource();src.buffer=mb;src.loop=true;src.connect(gi);gi.connect(go);go.connect(c.destination);src.start(t);ph=1}
function mus(){var c=ac();if(!c||!window.__mcCur)return;if(document.hidden){pauseAll();return}var s=window.__mcCur().s,mc=H.classList.contains('mc');
if(!mc||s<100||s>=236){if(ph||mb||ld)stop();return}
prep();if(!mb||!cb||s<128)return;
var mut=false;try{mut=sndMuted}catch(e){}
if(ph===0){if(mut)return;if(c.state!=='running'){c.resume().catch(function(){});return}begin(s)}
if(go)go.gain.value=mut?0:(s>222?Math.max(0,(236-s)/14):1)}
setInterval(mus,300);
/* свернули приложение — ставим весь звук на паузу, вернулись — продолжаем с того же места */
function pauseAll(){var c=ac();try{if(c&&c.state==='running')c.suspend().catch(function(){})}catch(e){}}
function resumeAll(){var c=ac();try{if(c&&c.state==='suspended'&&!document.hidden)c.resume().catch(function(){})}catch(e){}}
document.addEventListener('visibilitychange',function(){document.hidden?pauseAll():resumeAll()});
addEventListener('pagehide',pauseAll);addEventListener('pageshow',resumeAll);
document.addEventListener('pause',pauseAll,false);document.addEventListener('resume',resumeAll,false);
try{var APP=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
if(APP&&APP.addListener){APP.addListener('appStateChange',function(s){s&&s.isActive?resumeAll():pauseAll()});APP.addListener('pause',pauseAll);APP.addListener('resume',resumeAll)}}catch(e){}
})();
</script>
